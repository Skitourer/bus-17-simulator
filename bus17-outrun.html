<title>Bus 17 en route</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
/* Layout: one-screen game, 16-bit look: scene rendered at 480x270 and upscaled with hard pixels. Single dark look by choice. */
:root{--ink:#0e1020;--hud:#f4efe2;--accent:#ffb02e;--soft:#9aa6c8;color-scheme:dark;
  --pixel:"Press Start 2P",ui-monospace,"Courier New",monospace}
html,body{height:100%}
body{background:var(--ink);color:var(--hud);font-family:var(--pixel);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:relative;height:100%;display:flex;align-items:center;justify-content:center}
canvas{display:block;max-width:100%;max-height:100%;width:100%;aspect-ratio:16/9;background:#000;image-rendering:pixelated}
#start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:rgba(14,16,32,.78);text-align:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#start[hidden]{display:none}
#start h1{margin:0;font-size:clamp(20px,5vw,40px);color:var(--accent);text-shadow:4px 4px 0 #7a2a10;letter-spacing:.04em}
#start p{margin:0;color:var(--soft);max-width:40em;line-height:1.9;font-size:clamp(9px,1.6vw,12px)}
.cities{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.city{font:12px var(--pixel);padding:14px 18px;border:3px solid var(--accent);background:#1b1d38;color:var(--hud);cursor:pointer;box-shadow:4px 4px 0 #000}
.city:hover{background:#2a2d55}
.city:focus-visible,.pad:focus-visible,#citybtn:focus-visible{outline:3px solid var(--hud);outline-offset:2px}
#citybtn{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);font:10px var(--pixel);
  padding:8px 12px;border:2px solid var(--accent);background:rgba(14,16,32,.75);color:var(--accent);cursor:pointer}
#pads{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;gap:12px;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none}
#pads .grp{display:flex;gap:10px}
.pad{pointer-events:auto;width:64px;height:64px;border-radius:50%;border:2px solid rgba(244,239,226,.5);background:rgba(22,24,51,.55);color:var(--hud);font:16px var(--pixel)}
.pad.on{background:rgba(255,176,46,.55)}
@media (hover:hover) and (pointer:fine){#pads{display:none}}
</style>

<div id="wrap">
  <canvas id="c" width="960" height="540"></canvas>
  <button id="citybtn" hidden>Ville ▸</button>
  <div id="pads">
    <div class="grp"><button class="pad" data-k="left" aria-label="Gauche">◀</button><button class="pad" data-k="right" aria-label="Droite">▶</button></div>
    <div class="grp"><button class="pad" data-k="down" aria-label="Frein / marche arrière">▼</button><button class="pad" data-k="up" aria-label="Accélérer">▲</button></div>
  </div>
  <div id="start">
    <h1>BUS WORLD TOUR</h1>
    <p>Choisis ta ville. Arrête le bus le long du trottoir à hauteur de chaque abri pour ouvrir les portes.</p>
    <div class="cities">
      <button class="city" data-city="paris">Paris</button>
      <button class="city" data-city="munich">München</button>
      <button class="city" data-city="rome">Roma</button>
      <button class="city" data-city="nyc">New York</button>
    </div>
    <p>Z/↑ accélérer · S/↓ freiner, reculer · Q D/← → tourner · C changer de ville</p>
  </div>
</div>

function dome(g,cx,by,rx,ry,c){for(let y=0;y<ry;y++){const hw=Math.round(rx*Math.sqrt(1-(y/ry)**2));R(g,cx-hw,by-y-1,hw*2,1,c);}}
function disc(g,cx,cy,r,c){for(let y=-r;y<=r;y++){const hw=Math.round(Math.sqrt(r*r-y*y));R(g,cx-hw,cy+y,hw*2,1,c);}}
function rng(seed){let s=seed;return()=>(s=(s*16807)%2147483647)/2147483647;}
function ridge(g,w,base,amp,freqs,c,snow,snowLine){for(let x=0;x<w;x++){
  const y=Math.round(base-amp*freqs.reduce((s,[f,a,p])=>s+a*Math.sin(2*Math.PI*f*x/w+p),0));

function gable(g,x,top,bw,c){const h=Math.round(bw/3);for(let i=0;i<h;i++){const ins=Math.round((h-i)*bw/(2*h));R(g,x+ins,top-h+i,bw-2*ins,1,c);}}

function eiffel(g,cx,by,h,c,c2){for(let y=0;y<h;y++){const t=y/h,hw=Math.max(1,Math.round(26*Math.pow(1-t,2.4)+1));R(g,cx-hw,by-y,hw*2,1,y%3?c:c2);}
  [.22,.5].forEach(f=>{const hw=Math.round(26*Math.pow(1-f,2.4)+4);R(g,cx-hw,by-Math.round(h*f),hw*2,2,c);});R(g,cx,by-h-6,1,6,c);}
function sacreCoeur(g,x,b){R(g,x-15,b-9,30,10,'#f3e6dc');dome(g,x,b-9,8,13,'#f8eee6');R(g,x-1,b-27,2,6,'#f8eee6');
  dome(g,x-11,b-9,4,6,'#eadbd0');dome(g,x+11,b-9,4,6,'#eadbd0');R(g,x+15,b-22,4,23,'#eadbd0');dome(g,x+17,b-22,3,4,'#eadbd0');}

  R(g,cx-1,by-130,2,14,'#b8bcd0');R(g,cx,by-134,1,4,'#ff3b3b');
  const r=rng(7);for(let y=by-100;y<by;y+=4)for(let x=cx-13;x<cx+13;x+=3)if(r()<.3)R(g,x,y,1,2,'#f3cf6a');}

  const r=rng(8);for(let y=by-88;y<by;y+=4)for(let x=cx-8;x<cx+8;x+=3)if(r()<.3)R(g,x,y,1,2,'#f3cf6a');}

function update(dt){
  const pSeg=findSeg(pos+camBack),sp=Math.abs(speed)/maxSpeed,dx=dt*1.6*Math.max(sp,0.15)*(speed===0?0:1);
  if(keys.left)playerX-=dx; if(keys.right)playerX+=dx;
  playerX-=dt*2*sp*sp*pSeg.curve*centrifugal*Math.sign(speed);
  if(keys.up)speed+=accel*dt;
  else if(keys.down)speed+= speed>M*0.3? brakeA*dt : (revMax-speed)*dt*1.5;
  else speed+= speed>0? Math.max(decel*dt,-speed) : Math.min(-speed,-decel*dt);
  if(Math.abs(playerX)>1.05&&speed>offRoadLimit)speed+=offRoadDecel*dt;
  playerX=clamp(playerX,-1.9,1.9);speed=clamp(speed,revMax,maxSpeed);
  pos=((pos+dt*speed)%trackLen+trackLen)%trackLen;
  camX+=(playerX*roadW*0.8-camX)*Math.min(1,dt*2.2);
  for(const c of cars){let rel=wrapRel(c.z-(pos+camBack));c.cur=c.sp;
    if(c.dir>0&&rel<0&&rel>-(c.len+8*M)&&Math.abs(c.o-playerX)<0.8)c.cur=Math.max(0,Math.min(c.sp,speed));
    c.z=((c.z+c.dir*c.cur*dt)%trackLen+trackLen)%trackLen;rel=wrapRel(c.z-(pos+camBack));
    if(rel<player.len&&rel>-c.len&&Math.abs(c.o-playerX)<0.7){
      if(c.dir>0&&rel>0&&speed>c.cur){speed=c.cur*0.6;pos-=M*0.3;flash('Distance de sécurité !');}
      else if(c.dir<0){speed=Math.min(speed,0)-maxSpeed*0.05;playerX+=(playerX>c.o?0.15:-0.15);flash('Accrochage ! Recule');}}}
  const mid=findSeg(pos+camBack+player.len*0.75).i,st=stops.find(s=>!s.done&&Math.abs(s.seg-mid)<=12);
  if(st&&Math.abs(speed)<M*0.2&&playerX>0.6){doorT+=dt;if(doorT>2.4){st.done=true;served++;doorT=0;flash(st.name+' desservi');
      if(stops.every(s=>s.done)){stops.forEach(s=>s.done=false);flash('Terminus !');}}}
  else doorT=0;
  T.L.forEach(l=>l.off+=pSeg.curve*(speed/maxSpeed)*dt*l.px*0.03);

/* ---------- render ---------- */
function render(){

  sky((camY-camH)*0.002);
  for(const s of segs)s.cars.length=0;
  for(const c of cars)findSeg(c.z).cars.push(c);
  player.z=pos+camBack;player.o=playerX;findSeg(player.z).cars.push(player);
  let maxy=H,x=0,dx=-(base.curve*bp);
  for(let n=0;n<drawDist;n++){const s=segs[(base.i+n)%N],cz=pos-(s.i<base.i?trackLen:0);

    x+=dx;dx+=s.curve;s.clip=maxy;

  v.fillText('PROCHAIN ARRÊT',26,36);v.fillText('VITESSE',VW-198,36);
  v.fillStyle='#f4efe2';v.font=`13px ${F}`;
  if(next){v.fillText(next.s.name,26,60);v.fillStyle='#ffb02e';v.font=`10px ${F}`;v.fillText(Math.round(next.d*segL/M)+' m · servis '+served,26,82);}
  v.fillStyle='#ffb02e';v.font=`28px ${F}`;v.fillText((kmh<0?'R':'')+Math.abs(kmh),VW-198,84);
  v.fillStyle='#9aa6c8';v.font=`10px ${F}`;v.fillText('km/h',VW-82,84);
  const box=(t,c)=>{panel(VW/2-230,108,460,40);v.fillStyle=c;v.textAlign='center';v.font=`13px ${F}`;v.fillText(t,VW/2,136);};
  if(doorT>0)box('Portes ouvertes '+'▮'.repeat(1+Math.floor(doorT/0.45)),'#f4efe2');
  else if(msgT>0)box(msg,'#ffb02e');}

/* ---------- input & loop ---------- */
const map={KeyW:'up',KeyZ:'up',ArrowUp:'up',KeyS:'down',ArrowDown:'down',KeyA:'left',KeyQ:'left',ArrowLeft:'left',KeyD:'right',ArrowRight:'right'};
const nextCity=()=>setCity(ORDER[(ORDER.indexOf(T.key)+1)%ORDER.length]);
addEventListener('keydown',e=>{if(e.code==='KeyC'&&running){nextCity();return;}const k=map[e.code];if(k){keys[k]=true;e.preventDefault();}});
addEventListener('keyup',e=>{const k=map[e.code];if(k)keys[k]=false;});
document.querySelectorAll('.pad').forEach(b=>{const k=b.dataset.k,set=v=>{keys[k]=v;b.classList.toggle('on',v);};
  b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);set(true);});
  ['pointerup','pointercancel','lostpointercapture'].forEach(t=>b.addEventListener(t,()=>set(false)));});
const cityBtn=document.getElementById('citybtn');cityBtn.addEventListener('click',()=>{nextCity();cityBtn.blur();});

build();setCity('paris');msgT=0;pos=stops[0].seg*segL-camBack-BUS.len*0.75-40*segL;
let last=performance.now(),acc=0,running=false;
function loop(now){acc+=Math.min(1,(now-last)/1000);last=now;
  if(running)while(acc>step){update(step);acc-=step;} else acc=0;
  render();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
document.querySelectorAll('.city').forEach(b=>b.addEventListener('click',()=>{setCity(b.dataset.city);
  document.getElementById('start').hidden=true;cityBtn.hidden=false;running=true;}));
})();
</script>
