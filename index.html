<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bus Grenoble</title>
    <link rel="stylesheet" href="src/menu.css" />
  </head>
  <body>
    <main class="card title-screen" id="screen-title">
      <div class="title-badges" id="titleBadges"></div>
      <h1 class="game-name" data-i18n="menu.title"></h1>
      <p class="tagline" data-i18n="menu.subtitle"></p>
      <nav class="menu-buttons">
        <button class="go" data-screen="play" data-i18n="menu.play"></button>
        <button class="menu-button" data-screen="settings" data-i18n="menu.settings"></button>
        <button class="menu-button" data-screen="credits" data-i18n="menu.creditsTitle"></button>
      </nav>
    </main>

    <main class="card" id="screen-play" hidden>
      <header class="title">
        <div class="badge">17</div>
        <div>
          <h1 data-i18n="menu.title"></h1>
          <p id="sub" data-i18n="menu.subtitle"></p>
        </div>
      </header>

      <section class="group">
        <h2 data-i18n="menu.line"></h2>
        <div class="chips" id="lineChips"><span class="empty" data-i18n="menu.loading"></span></div>
      </section>
      <section class="group">
        <h2 data-i18n="menu.direction"></h2>
        <div class="chips" id="dirChips"><span class="empty" data-i18n="menu.loading"></span></div>
      </section>

      <section class="group">
        <h2 data-i18n="menu.bus"></h2>
        <div class="chips" id="busChips">
          <button class="chip on" data-bus="std">
            <svg width="54" height="20" viewBox="0 0 54 20" aria-hidden="true">
              <rect x="1" y="2" width="44" height="13" rx="3" fill="#33a457" />
              <rect x="5" y="4" width="34" height="5" fill="#1b2a33" />
              <circle cx="10" cy="16" r="3" fill="#111" />
              <circle cx="36" cy="16" r="3" fill="#111" />
            </svg>
            <span data-i18n="menu.busStandard"></span> <small data-i18n="menu.lengthStandard"></small>
          </button>
          <button class="chip" data-bus="art">
            <svg width="54" height="20" viewBox="0 0 54 20" aria-hidden="true">
              <rect x="1" y="2" width="30" height="13" rx="3" fill="#33a457" />
              <rect x="31" y="3" width="3" height="11" fill="#333" />
              <rect x="34" y="2" width="19" height="13" rx="3" fill="#33a457" />
              <rect x="4" y="4" width="24" height="5" fill="#1b2a33" />
              <rect x="36" y="4" width="14" height="5" fill="#1b2a33" />
              <circle cx="8" cy="16" r="3" fill="#111" />
              <circle cx="25" cy="16" r="3" fill="#111" />
              <circle cx="46" cy="16" r="3" fill="#111" />
            </svg>
            <span data-i18n="menu.busArticulated"></span> <small data-i18n="menu.lengthArticulated"></small>
          </button>
        </div>
      </section>

      <section class="group">
        <h2 data-i18n="menu.day"></h2>
        <div class="chips" id="dayChips"></div>
      </section>

      <section class="group">
        <h2 data-i18n="menu.season"></h2>
        <div class="chips" id="seasonChips"></div>
        <label class="date-field">
          <span data-i18n="menu.otherDate"></span>
          <input type="date" id="dateInput" />
        </label>
        <p class="note" id="dateNote"></p>
      </section>

      <section class="group">
        <h2 data-i18n="menu.departure"></h2>
        <div class="deps" id="deps"></div>
      </section>

      <button class="go" id="goBtn" disabled data-i18n="menu.start"></button>

      <section class="group help">
        <div data-i18n-html="menu.helpKeys"></div>
        <div data-i18n-html="menu.helpCamera"></div>
        <div data-i18n="menu.helpStops"></div>
      </section>
      <button class="menu-button back" data-screen="title" data-i18n="menu.back"></button>
    </main>

    <main class="card" id="screen-settings" hidden>
      <header class="title">
        <div class="badge">17</div>
        <h1 data-i18n="settings.title"></h1>
      </header>
      <section class="group">
        <h2 data-i18n="settings.language"></h2>
        <div class="chips" id="languageChips"></div>
      </section>
      <section class="group">
        <h2 data-i18n="settings.quality"></h2>
        <div class="chips" id="qualityChips"></div>
      </section>
      <section class="group">
        <h2 data-i18n="settings.viewDistance"></h2>
        <div class="chips" id="viewDistanceChips"></div>
      </section>
      <section class="group">
        <h2 data-i18n="settings.difficulty"></h2>
        <div class="chips" id="difficultyChips"></div>
        <p class="note" data-i18n="settings.difficultyHelp"></p>
      </section>
      <section class="group">
        <h2 data-i18n="settings.traffic"></h2>
        <div class="chips" id="trafficChips"></div>
      </section>
      <section class="group">
        <h2 data-i18n="settings.pedestrians"></h2>
        <div class="chips" id="pedestrianChips"></div>
      </section>
      <section class="group">
        <h2 data-i18n="settings.volume"></h2>
        <div class="chips" id="volumeChips"></div>
      </section>
      <section class="group">
        <h2 data-i18n="settings.announcements"></h2>
        <div class="chips" id="announcementChips"></div>
        <p class="note" data-i18n="settings.announcementsHelp"></p>
      </section>
      <section class="group">
        <h2 data-i18n="settings.debug"></h2>
        <div class="chips" id="debugChips"></div>
        <p class="note" data-i18n="settings.debugHelp"></p>
      </section>
      <section class="group">
        <h2 data-i18n="settings.keys"></h2>
        <p class="note" data-i18n="settings.keysHelp"></p>
        <div class="keys" id="keyList"></div>
        <p class="note warn" id="keyMessage" role="status"></p>
      </section>
      <p class="note" id="saveMessage" role="status"></p>
      <div class="row">
        <button class="menu-button back" data-screen="title" data-i18n="menu.back"></button>
        <button class="menu-button" id="resetBtn" data-i18n="settings.reset"></button>
      </div>
    </main>

    <main class="card" id="screen-credits" hidden>
      <header class="title">
        <div class="badge">17</div>
        <h1 data-i18n="menu.creditsTitle"></h1>
      </header>
      <section class="group help">
        <div data-i18n="menu.credits"></div>
        <div data-i18n="menu.developedWith"></div>
      </section>
      <button class="menu-button back" data-screen="title" data-i18n="menu.back"></button>
    </main>
    <script type="module" src="src/menu.js"></script>
  </body>
</html>
