[project]
name = "bus-17-simulator-tools"
version = "0.1.0"
description = "Scripts that build the game data (route, map, terrain, buildings) from GTFS, OSM and IGN."
license = "MIT"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
  "poethepoet==0.49.0",
  "pre-commit==4.7.0",
  "pyright==1.1.414",
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "ruff==0.17.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["tools/cache"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # pytest uses assert

[tool.ruff.format]
quote-style = "single"

[tool.pyright]
include = ["tools", "tests/python"]
exclude = ["tools/cache"]
typeCheckingMode = "strict"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
extraPaths = ["tools"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["tools"]
addopts = "--cov=geo --cov-report=term-missing --cov-fail-under=80"

[tool.poe.tasks]
format = "ruff format"
lint = "ruff check"
typecheck = "pyright"
test = "pytest"
check = ["_format_check", "lint", "typecheck", "test"]
_format_check = "ruff format --check"
