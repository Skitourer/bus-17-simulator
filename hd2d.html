<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bus 17</title>
    <link rel="stylesheet" href="src/hd2d/hd2d.css" />
    <script type="importmap">
      { "imports": { "three": "./vendor/three.module.min.js" } }
    </script>
  </head>
  <body>
    <canvas id="view"></canvas>

    <header id="syn">
      <div class="badge">17</div>
      <div id="track">
        <div class="rail"></div>
        <div class="done" id="trDone"></div>
        <div id="trStops"></div>
        <div class="bus" id="trBus"></div>
      </div>
      <div id="clock">
        <div class="t" id="clk">--:--:--</div>
        <div class="d" id="svc"></div>
      </div>
    </header>

    <section id="sae">
      <div class="row"><span data-i18n="game.nextStop"></span><span id="saeDist"></span></div>
      <div class="stop" id="saeStop">—</div>
      <div class="row"><span id="saeSched"></span><span id="saeDelta"></span></div>
    </section>

    <section id="speed">
      <div class="v" id="spd">0</div>
      <div class="u">km/h</div>
      <div class="alt"><span id="alt">— m</span><span id="slope"></span></div>
    </section>

    <div id="offroute" hidden data-i18n="game.offRoute"></div>
    <div id="toasts"></div>
    <button id="camReset" hidden data-i18n="game.resetView"></button>

    <div id="map" class="small">
      <canvas id="mapc"></canvas>
      <div class="mapbtns">
        <button data-act="in" data-i18n-title="game.zoomIn">+</button>
        <button data-act="out" data-i18n-title="game.zoomOut">−</button>
        <button data-act="follow" data-i18n-title="game.follow">⌖</button>
        <button data-act="size" data-i18n-title="game.mapSize">⤢</button>
      </div>
      <div class="attrib">© OpenStreetMap</div>
    </div>

    <div id="keys" data-i18n-html="game.keys"></div>

    <section id="debug" hidden>
      <div id="debugInfo"></div>
      <div data-i18n-html="debug.keys"></div>
    </section>

    <div id="loading">
      <div class="badge">17</div>
      <p id="loadMsg"></p>
    </div>
    <div id="pause" hidden>
      <p data-i18n="game.pause"></p>
      <button id="resume" data-i18n="game.resume"></button><button id="quit" data-i18n="game.quit"></button>
    </div>

    <script type="module" src="src/hd2d/main.js"></script>
  </body>
</html>
